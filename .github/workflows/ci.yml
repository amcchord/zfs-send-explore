name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release --bin zfs-send-explore-windows
      - shell: pwsh
        run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: zfs-send-explore-windows-x86_64
          path: target/windows-package/zfs-send-explore-windows-x86_64.zip
      - name: Install screenshot fixture decoder
        if: github.event_name == 'push' && startsWith(github.ref_name, 'agent/windows-ux')
        run: python -m pip install --disable-pip-version-check zstandard
      - name: Capture native UI screenshots
        if: github.event_name == 'push' && startsWith(github.ref_name, 'agent/windows-ux')
        shell: pwsh
        run: .\scripts\capture-windows-ui.ps1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref_name, 'agent/windows-ux')
        with:
          name: windows-ui-screenshots
          path: artifacts/windows-ui
          if-no-files-found: error
