name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

      - name: Restore a real two-member stripe
        timeout-minutes: 12
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends zfsutils-linux
          if ! modinfo zfs >/dev/null 2>&1; then
            sudo apt-get install --yes "linux-modules-extra-$(uname -r)"
          fi
          sudo modprobe zfs
          cargo build --locked --bin zfs-send-extract
          fixture="$RUNNER_TEMP/zfse-stripe"
          sudo ./scripts/create-striped-pool-fixture.sh "$fixture"
          foreign="zfse_other_${GITHUB_RUN_ID}"
          sudo truncate -s 96M "$fixture/other.img"
          sudo zpool create -o cachefile=none -O mountpoint=none "$foreign" "$fixture/other.img"
          sudo zpool export "$foreign"
          sudo chown -R "$(id -u):$(id -g)" "$fixture"
          python3 scripts/verify-striped-pool.py target/debug/zfs-send-extract "$fixture" \
            "$RUNNER_TEMP/stripe-restores" --foreign-member "$fixture/other.img"
          ZFSE_STRIPE_FIXTURE="$fixture" cargo test --locked --test desktop_service desktop_restores_versions_and_nested_files_from_a_stripe -- --ignored --exact

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
      - run: cargo build --release --bin zfs-send-explore-windows
      - shell: pwsh
        run: .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: zfs-send-explore-windows-x86_64
          path: target/windows-package/zfs-send-explore-windows-x86_64.zip

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: ./scripts/test-macos-time.sh
      - run: ./scripts/test-macos-drives.sh
      - run: python3 scripts/test-macos-full-destination.py
      - run: ./scripts/package-macos.sh
      - run: python3 scripts/verify-macos-package.py 'target/macos-package/ZFS Explore.app'
      - uses: actions/upload-artifact@v4
        with:
          name: zfs-send-explore-macos-${{ matrix.arch }}
          path: |
            target/macos-package/*.zip
            target/macos-package/*.tar.gz
            target/macos-package/SHA256SUMS.txt
      - name: Exercise the packaged Mac app
        timeout-minutes: 12
        run: ./scripts/test-macos-gui.sh "target/macos-package/zfs-send-explore-macos-${{ matrix.arch }}.zip" "$RUNNER_TEMP/package-gui"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-gui-results-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/package-gui/*.sha256
            ${{ runner.temp }}/package-gui/verification.txt
            ${{ runner.temp }}/package-gui/*.log
            ${{ runner.temp }}/package-gui/restored
            ${{ runner.temp }}/package-gui/occupied
            ${{ runner.temp }}/package-gui/Qualification.xcresult
