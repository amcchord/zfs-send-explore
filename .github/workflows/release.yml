name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --bin zfs-send-extract
      - name: Package Linux CLI
        run: |
          mkdir -p dist
          cp target/release/zfs-send-extract dist/zfs-send-extract
          tar -czf dist/zfs-send-extract-linux-x86_64.tar.gz -C dist zfs-send-extract
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/zfs-send-extract-linux-x86_64.tar.gz
          if-no-files-found: error

  windows-clients:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - shell: pwsh
        run: .\scripts\package-windows.ps1
      - name: Collect Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\zfs-send-extract.exe dist\zfs-send-extract-windows-x86_64.exe
          Copy-Item target\release\zfs-send-explore-windows.exe dist\zfs-send-explore-windows-x86_64.exe
          Copy-Item target\windows-package\zfs-send-explore-windows-x86_64.zip dist\zfs-send-explore-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist
          if-no-files-found: error

  macos-clients:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/package-macos.sh
      - run: python3 scripts/verify-macos-package.py 'target/macos-package/ZFS Explore.app'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.arch }}
          path: |
            target/macos-package/*.zip
            target/macos-package/*.tar.gz
          if-no-files-found: error

  publish:
    needs:
      - linux-cli
      - windows-clients
      - macos-clients
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksum manifest
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS.txt
      - name: Create draft release (Mac artifacts require notarization)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$version"
          notes=(--generate-notes)
          if [[ -f "docs/releases/$GITHUB_REF_NAME.md" ]]; then
            notes=(--notes-file "docs/releases/$GITHUB_REF_NAME.md")
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ZFS Send Explore $GITHUB_REF_NAME" \
            --draft \
            "${notes[@]}"
