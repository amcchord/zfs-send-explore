[package]
name = "zfs-send-extract"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
description = "Browse and extract individual files from ZFS send streams without ZFS"
repository = "https://github.com/amcchord/zfs-send-explore"
keywords = ["zfs", "backup", "forensics", "filesystem"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
zfs-forensic-core = "0.1.1"

[profile.release]
lto = "thin"
strip = true
